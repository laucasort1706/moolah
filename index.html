<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moolah</title>
  <link rel="manifest" href="./public/manifest.json">
  <link rel="stylesheet" href="./src/assets/css/main.css">
  <meta name="theme-color" content="#0284c7">

  <!-- Meta Tags indispensables para iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moolah">
  <link rel="apple-touch-icon" href="./public/icons/icon-192.png">
</head>
<body>
  <div class="container">
    <h1>Moolah</h1>

    <div class="card">
      <label for="fileInput" class="btn-secondary">Seleccionar Foto / Archivo</label>
      <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none;">
      <div id="preview" class="preview-area"></div>
    </div>

    <button id="btnPush" class="btn-primary">Activar Notificaciones</button>
  </div>

  <!-- Importante: type="module" habilita la sintaxis import/export -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
